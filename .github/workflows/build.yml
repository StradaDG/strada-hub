name: Build Windows portable
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm install
      - run: npx tauri build --no-bundle
      - name: Publicar en release "portable"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/strada-hub.exe Strada-Hub-portable.exe
          gh release view portable >/dev/null 2>&1 || gh release create portable --title "Strada Hub portable (Windows)" --notes "Se actualiza solo con cada cambio. Bajá Strada-Hub-portable.exe y abrilo, no se instala." --prerelease
          gh release upload portable Strada-Hub-portable.exe --clobber
          gh release edit portable --notes "Última versión: ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC'). Bajá Strada-Hub-portable.exe y abrilo, no se instala."

# Mac: se reactiva cuando la versión de Windows esté final.
