<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strada Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:.42;--glass:rgba(22,26,38,var(--a));--edge:rgba(255,255,255,.26);--mute:rgba(255,255,255,.7);--ink:#fff;--soft:rgba(255,255,255,.12);--soft2:rgba(255,255,255,.25);--track:rgba(255,255,255,.2);--panel:rgba(22,26,38,.88);--shadow:0 1px 3px rgba(0,0,0,.4);--acc:#2fd3c6;--warn:#ff7a66;--gold:#ffc94d;--rain:#4cc3ff;--hail:#c4b2ff;--org:#ffa94d;--red:#ff5a5a;--nh:64px;--gap:7px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:transparent;color:var(--ink);font:12.5px/1.35 Inter,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;text-shadow:var(--shadow)}
body.light{--glass:rgba(255,255,255,var(--a));--edge:rgba(255,255,255,.75);--mute:rgba(0,0,0,.58);--ink:#14171f;--soft:rgba(0,0,0,.07);--soft2:rgba(0,0,0,.14);--track:rgba(0,0,0,.12);--panel:rgba(255,255,255,.94);--shadow:none;--acc:#0f9b90}
body.light .cl{fill:#a9b6c6}
body.light .card{box-shadow:0 2px 10px rgba(0,0,0,.08)}
body.web{background:linear-gradient(135deg,#1b2a4a,#3a2347 55%,#122c33);min-height:100vh}
body.web #hub{width:340px}
#hub{display:flex;flex-direction:column;gap:var(--gap);padding:6px;width:100%}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:15px;padding:9px 12px;display:flex;align-items:center;gap:10px;min-height:56px}
[hidden]{display:none!important}
.mute{color:var(--mute);font-size:11px}
.grow{flex:1}
/* barra */
.top{min-height:38px;padding:5px 6px 5px 10px;cursor:grab}
.brand{flex:none;background:none;border:0;padding:2px 4px;cursor:pointer;display:grid;place-items:center;border-radius:8px;
  --g1:rgba(255,255,255,.55);--g2:rgba(255,255,255,.14);--g3:rgba(255,255,255,.42);--glow:rgba(255,255,255,0)}
body.light .brand{--g1:rgba(0,0,0,.38);--g2:rgba(0,0,0,.1);--g3:rgba(0,0,0,.3)}

  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
  background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%);
  position:relative;filter:drop-shadow(0 0 .6px rgba(255,255,255,.5));transition:filter 1.4s ease}
.brand .mark::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;transition:opacity 1.4s ease}
body.light .brand .mark::after{background:#111}
.brand:hover .mark::after{opacity:1}
.brand:hover .mark{filter:drop-shadow(0 0 7px rgba(255,255,255,.75))}
body.light .brand:hover .mark{filter:drop-shadow(0 0 6px rgba(0,0,0,.25))}
.top .date{font-size:13px;font-weight:600;white-space:nowrap}
.top #city{font-size:11px}
.hour{font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-right:4px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.act{background:var(--soft);border:1px solid var(--edge);color:var(--ink);border-radius:9px;padding:7px 4px;font:600 11.5px Inter,sans-serif;cursor:pointer;text-shadow:none}
.act:hover{background:var(--soft2)}
.act.on{background:#fff;color:#111;border-color:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.act.x:hover{background:var(--warn);color:#fff}
#c-clima{cursor:pointer}
#c-clima:hover{border-color:rgba(255,255,255,.5)}
.ic{background:var(--soft);border:1px solid var(--edge);color:var(--ink);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:12px;flex:none;padding:0}
.ic:hover{background:var(--soft2)}
.ic.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.top.locked{cursor:default}
/* clima */
.temp{font-size:30px;font-weight:600;line-height:1}
.wxi{width:38px;height:38px;flex:none}
/* lluvia + granizo */
.rh{flex-direction:column;align-items:stretch;gap:7px}
.rh .head{display:flex;align-items:center;gap:10px;padding-bottom:9px}
.ring{position:relative;width:42px;height:42px;flex:none}
.ring svg{width:42px;height:42px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px}
.ring span{position:absolute;left:0;right:0;bottom:-13px;text-align:center;font-size:9px;color:var(--mute)}
.tag{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:rgba(47,211,198,.3);white-space:nowrap;display:inline-block}
.tag.l1{background:var(--org);color:#2a1300;text-shadow:none}.tag.l2{background:var(--red)}
.strip{display:grid;grid-template-columns:34px 1fr;gap:3px 6px;align-items:center;font-size:9.5px;color:var(--mute)}
.cells{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.cells i{height:9px;border-radius:2px;background:var(--soft)}
.cells i.r1{background:#5ad8e6}.cells i.r2{background:var(--rain)}.cells i.r3{background:#2f7dff}
.cells i.h1{background:var(--org)}.cells i.h2{background:var(--red)}
.hrs{display:grid;grid-template-columns:repeat(12,1fr);font-size:9px;color:var(--mute);text-align:center}
.hn{font-size:10.5px;color:var(--hail)}
/* clima unificado */
.wxc{flex-direction:column;align-items:stretch;gap:7px;padding:9px 12px}
.wxc .now{display:flex;align-items:center;gap:9px}
.wxc .wxi{width:34px;height:34px}
.wxc .temp{font-size:28px}
.wxc .st{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px}
.wxc .strip{grid-template-columns:62px 1fr}
.wxc .strip b{color:var(--ink);font-size:10px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;text-align:center;border-top:1px solid var(--soft);padding-top:6px}
.days div{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;gap:0 4px;font-size:10.5px;white-space:nowrap}
.days div .mute:first-child{grid-column:span 2}
.days svg{width:18px;height:18px;flex:none;grid-row:span 2}
.days b{font-size:11px;line-height:1.1}
/* resultados */
.sp{padding:0 2px;min-height:40px;gap:0}
.sp .vp{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.sp .rail{display:flex;width:max-content;will-change:transform}
.sp .nav2{background:none;border:0;color:var(--mute);cursor:pointer;font-size:15px;width:22px;height:38px;padding:0;flex:none}
.sp .nav2:hover{color:var(--ink)}
.sp .tile{display:flex;align-items:center;gap:6px;padding:11px 14px;white-space:nowrap;cursor:default;border-right:1px solid var(--soft)}
.sp svg{width:16px;height:16px;color:var(--ink);opacity:.95}
.sp .nm{font-size:9.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sp .sc{font-size:13px;line-height:1;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sp .tm{font-size:10.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.sp .dt{font-size:9px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:3px;vertical-align:1px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
/* columnas */
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;flex:1;text-align:center}
.cols b{display:block;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols svg{width:24px;height:24px;display:block;margin:1px auto}
.side{writing-mode:vertical-rl;transform:rotate(180deg);flex:none}
/* feed de noticias */
.arrow{align-self:center;background:var(--glass);border:1px solid var(--edge);color:var(--ink);border-radius:999px;height:22px;width:60px;cursor:pointer;font-size:11px;line-height:1;padding:0;opacity:.55;transition:opacity .2s}
.arrow.on{opacity:1}.arrow:hover{background:var(--soft2)}
.arrow .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:5px;vertical-align:middle}
#feed{height:calc(var(--n) * var(--nh) + (var(--n) - 1) * var(--gap));overflow-y:auto;scroll-behavior:smooth;scrollbar-width:none;display:flex;flex-direction:column;gap:var(--gap)}
#feed::-webkit-scrollbar{display:none}
.nc{height:auto;min-height:var(--nh);max-height:var(--nh);flex:none;cursor:pointer;display:block;padding:8px 12px;transition:max-height .45s cubic-bezier(.2,.8,.2,1),background .3s}
.nc .d{display:none;font-size:11.5px;color:var(--mute);margin-top:5px;line-height:1.4}
/* previsualización: a los 2 s con el mouse encima, la tarjeta se abre y muestra el título completo */
.nc.open{max-height:320px;background:rgba(22,26,38,calc(var(--a) + .25))}
body.light .nc.open{background:rgba(255,255,255,calc(var(--a) + .3))}
.nc.open .t{-webkit-line-clamp:unset;display:block}
.nc.open .d{display:block}
.nc.open .mute{white-space:normal}
.nc{overflow:hidden}
.nc .mute{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px;line-height:1.3}
.nc:hover .t{color:var(--acc)}
.nc{position:relative}
.nc::before{content:'';position:absolute;left:5px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--c,transparent)}
body.light .nc::before{filter:brightness(.8) saturate(1.3)}
.nc .k{font-weight:700;color:var(--ink)}
.cdot{display:inline-block;width:2px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pf{display:inline-block;color:#fff;border-radius:5px;padding:0 6px;margin-right:5px;font-size:11px;font-weight:700;text-shadow:none;vertical-align:1px}
.nc.new{animation:up .6s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.nc.new{animation:none}#feed{scroll-behavior:auto}}
/* opciones */
.set{flex-direction:column;align-items:stretch;gap:8px;background:var(--panel);max-height:560px;overflow-y:auto;overscroll-behavior:contain;padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
/* barra de desplazamiento propia: finita, translúcida, se ilumina al usarla */
.set::-webkit-scrollbar{width:6px}
.set::-webkit-scrollbar-track{background:transparent;margin:10px 0}
.set::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:6px}
.set::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.6)}
body.light .set{scrollbar-color:rgba(0,0,0,.3) transparent}
body.light .set::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22)}
body.light .set::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.45)}
.set>*{flex:none}
.set h3{margin:4px 0 0;font-size:11px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
.set input[type=text],.set input:not([type]){width:100%;background:var(--soft);border:1px solid var(--edge);border-radius:8px;color:var(--ink);padding:6px 8px;font:12px Inter,sans-serif;user-select:text;-webkit-user-select:text}
input[type=range]{width:100%;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--soft);border:1px solid var(--edge);color:var(--mute);border-radius:999px;padding:3px 9px;font:600 11px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--panel);text-shadow:none}
body:not(.light) .chip.on{color:#222}
.src{display:flex;align-items:center;gap:6px;padding:3px 0;border-top:1px solid var(--soft)}
.src:first-child{border-top:0}
.src .x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:14px}
.src .x:hover{color:var(--warn)}
.add{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.add .u{grid-column:span 2}
.btn{border:0;border-radius:8px;padding:7px;font:600 12px Inter,sans-serif;cursor:pointer;background:var(--acc);color:#0b2422;text-shadow:none}
.btn.red{background:var(--warn);color:#2a0d08}
.btn.ghost{background:var(--soft);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.res{display:flex;flex-direction:column;gap:2px}
.res button{text-align:left;background:var(--soft);border:0;border-radius:6px;padding:6px 8px;color:var(--ink);font:12px Inter,sans-serif;cursor:pointer}
.res button:hover{background:var(--soft2)}
.row2{display:flex;gap:5px}.row2 input{flex:1;width:auto!important}.row2 .btn{flex:none;padding:7px 12px}
body.light .hn{color:#6b4fd8}
.err{color:var(--warn);font-size:11px}
</style>
</head>
<body>
<div id="hub">
  <div class="card top" data-tauri-drag-region>
    <button class="brand" id="brand" title="@hugo_strada en Instagram" aria-label="Strada en Instagram"><span class="mark"></span></button>
    <div class="grow" data-tauri-drag-region><div class="date" id="date" data-tauri-drag-region></div><div class="mute" id="city" data-tauri-drag-region>Ubicando…</div></div>
    <div class="hour" id="clock" data-tauri-drag-region></div>
    <button class="ic" id="bCfg" title="Opciones">⚙</button>
  </div>

  <div class="card set" id="cfg" hidden>
    <div class="acts">
      <button class="act" id="bLock" title="Bloquea la posición del widget">📌 Anclar</button>
      <button class="act" id="bRef">↻ Actualizar</button>
      <button class="act x" id="bX">✕ Cerrar</button>
    </div>
    <h3>Ubicación</h3>
    <div class="seg"><button class="chip" id="locAuto">Automática</button><button class="chip" id="locMan">Elegir ciudad</button></div>
    <div id="locBox" hidden><div class="row2"><input id="locQ" placeholder="Escribí una ciudad"><button class="btn" id="locGo">Buscar</button></div><div class="res" id="locRes"></div></div>
    <h3>Arrancar con la computadora</h3>
    <div class="seg"><button class="chip" data-auto="1">Sí</button><button class="chip" data-auto="0">No</button></div>
    <h3>Estilo</h3>
    <div class="seg"><button class="chip" data-th="dark">Oscuro</button><button class="chip" data-th="light">Blanco</button></div>
    <h3>Transparencia</h3>
    <input type="range" id="alpha" min="0" max="90" step="1">
    <h3>Noticias visibles <span id="nVal"></span></h3>
    <input type="range" id="nVis" min="2" max="8" step="1">
    <h3>Mostrar</h3>
    <div class="chips" id="cardChips"></div>
    <h3>Fuentes de noticias</h3>
    <div id="srcList"></div>
    <h3>Agregar fuente (link RSS)</h3>
    <div class="add">
      <input id="aCat" list="cats" placeholder="Categoría (ej. Autos)">
      <input id="aName" placeholder="Nombre">
      <input id="aUrl" class="u" placeholder="https://sitio.com/feed">
      <button class="btn u" id="aBtn">+ Agregar</button>
      <div class="err u" id="aErr"></div>
    </div>
    <datalist id="cats"></datalist>
    <button class="btn ghost" id="bReset">Restaurar fuentes predeterminadas</button>
  </div>

  <div class="card wxc" id="c-clima" data-name="Clima"><span class="mute">Cargando clima…</span></div>
  <div class="card sp" id="c-dep" data-name="Resultados"><span class="mute">Cargando resultados…</span></div>
  <div class="card" id="c-dolar" data-name="Dólar"><span class="mute">Cargando dólar…</span></div>

  <button class="arrow" id="up" title="Subir (más nuevas)">▲</button>
  <div id="feed"></div>
  <button class="arrow" id="down" title="Ver anteriores">▼</button>
</div>

<script>
{
const gn = q => 'https://news.google.com/rss/search?q='+encodeURIComponent(q+' when:3d')+'&hl=es-419&gl=AR&ceid=AR:es-419';
const DEFAULT_FEEDS = [
  {cat:'Autos', name:'Motor1', url:'https://ar.motor1.com/rss/news/all/'},
  {cat:'Autos', name:'Autoblog', url:'https://autoblog.com.ar/feed/'},
  {cat:'Autos', name:'Parabrisas', url:'https://parabrisas.perfil.com/feed'},
  {cat:'Motorsport', name:'Motorsport.com', url:'https://es.motorsport.com/rss/all/news/'},
  {cat:'F1', name:'Google Noticias', url:gn('"Fórmula 1" OR F1 OR Colapinto')},
  {cat:'NBA', name:'Google Noticias', url:gn('NBA básquet')},
  {cat:'Atenas', name:'Google Noticias', url:gn('"Atenas de Córdoba" OR "Atenas" básquet Liga Nacional')},
  {cat:'Fútbol Córdoba', name:'Google Noticias', url:gn('Belgrano OR Talleres OR Instituto fútbol Córdoba')},
  {cat:'Inter Miami', name:'Google Noticias', url:gn('"Inter Miami"')},
  {cat:'Córdoba', name:'La Voz', url:'https://www.lavoz.com.ar/arc/outboundfeeds/feeds/rss/?outputType=xml'},
  {cat:'Córdoba', name:'Diarios locales', url:gn('Córdoba (site:lavoz.com.ar OR site:eldoce.tv OR site:cadena3.com OR site:lmdiario.com.ar OR site:perfil.com OR site:telefenoticias.com.ar)')},
  {cat:'Series', name:'Google Noticias', url:gn('serie estreno (Netflix OR "Prime Video" OR "Disney+" OR Max OR "Apple TV+" OR "Paramount+")')},
  {cat:'Cine', name:'Espinof', url:'https://www.espinof.com/index.xml'},
  {cat:'Videojuegos', name:'Google Noticias', url:gn('videojuegos (lanzamiento OR anuncio OR tráiler) PlayStation OR Xbox OR Nintendo OR PC')},
  {cat:'Tecnología', name:'Xataka', url:'https://www.xataka.com/index.xml'},
  {cat:'Tecnología', name:'Google Noticias', url:gn('tecnología (Apple OR Google OR Samsung OR inteligencia artificial OR lanzamiento)')},
  {cat:'Música', name:'Google Noticias', url:gn('(nuevo álbum OR nuevo single OR nueva canción OR lanzamiento disco) música')},
  {cat:'Recitales Córdoba', name:'Google Noticias', url:gn('(recital OR show OR concierto OR festival) Córdoba (Quality OR "Plaza de la Música" OR Kempes OR Forja OR "Orfeo" OR Cosquín)')},
  {cat:'Automovilismo Córdoba', name:'Google Noticias', url:gn('automovilismo Córdoba ("Oscar Cabalén" OR TC OR "Turismo Carretera" OR Rally OR "TC2000" OR "Top Race" OR Picada OR karting)')}
];
const FEEDS_VER = 3;
const OLD_DEFAULT_URLS = ['https://ar.motor1.com/rss/news/all/','https://autoblog.com.ar/feed/','https://parabrisas.perfil.com/feed','https://es.motorsport.com/rss/all/news/','https://www.lavoz.com.ar/arc/outboundfeeds/feeds/rss/?outputType=xml','https://www.infobae.com/arc/outboundfeeds/rss/','https://www.espinof.com/index.xml'];
const CAT_COLORS = { 'Autos':'#ff8a3d', 'Motorsport':'#ffd43b', 'F1':'#ff2d2d', 'NBA':'#4c8dff', 'Atenas':'#1fb35a', 'Fútbol Córdoba':'#c6f04d',
  'Inter Miami':'#f7a8c8', 'Córdoba':'#2fd3c6', 'Series':'#b48cff', 'Cine':'#ff6fb0', 'Noticias':'#9fb3c8',
  'Videojuegos':'#7cff6b', 'Tecnología':'#5ac8fa', 'Música':'#e86bff', 'Recitales Córdoba':'#ff9f9f', 'Automovilismo Córdoba':'#d9a066' };
const catColor = c => CAT_COLORS[c] || `hsl(${[...String(c)].reduce((h,ch)=>(h*31+ch.charCodeAt(0))%360,7)} 75% 62%)`;
const PLATFORMS = [
  [/netflix/i,'Netflix','#e50914'], [/prime video|amazon prime/i,'Prime Video','#00a8e1'], [/disney\s?(\+|plus)/i,'Disney+','#113ccf'],
  [/hbo max|\bmax\b|\bhbo\b/i,'Max','#5b2bd8'], [/apple tv/i,'Apple TV+','#555'], [/paramount/i,'Paramount+','#0064ff'],
  [/star\s?\+/i,'Star+','#c2185b'], [/\bflow\b/i,'Flow','#00a19a'], [/crunchyroll/i,'Crunchyroll','#f47521'], [/movistar/i,'Movistar','#019df4']
];
const FALLBACK = { city:'Córdoba', lat:-31.42, lon:-64.18 };
const RM = 'https://raw.githubusercontent.com/StradaDG/rain-meter/main/';   // datos de Rain Meter
const RM_APP = 'https://stradadg.github.io/rain-meter/';                  // app de clima (se abre al tocar la tarjeta)
const CBA = { lat:-31.420, lon:-64.189 };
const DOLARES = { oficial:'Oficial', blue:'Blue', bolsa:'MEP', contadoconliqui:'CCL' };
const WIDTH = 340, KEEP = 80, PER_FEED = 15, NEWS_MIN = 3, WX_MIN = 10, SLIDE_SEC = 6;

const T = window.__TAURI__;
if (!T) document.body.classList.add('web');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };
const open = url => T?.opener ? T.opener.openUrl(url) : window.open(url,'_blank');

let feedsCfg = store.get('feeds', DEFAULT_FEEDS);
feedsCfg = feedsCfg.filter((f,i,a)=>a.findIndex(g=>g.url===f.url)===i);
if(store.get('feedsVer',1) < FEEDS_VER && store.get('feedsVer',1) >= 2){   // suma solo las fuentes nuevas
  const have=new Set(feedsCfg.map(f=>f.url)); feedsCfg=feedsCfg.concat(DEFAULT_FEEDS.filter(f=>!have.has(f.url)));
  store.set('feeds',feedsCfg); store.set('feedsVer',FEEDS_VER);
}
if(store.get('feedsVer',1) < 2){   // suma las fuentes nuevas y conserva las que agregó el usuario
  feedsCfg = DEFAULT_FEEDS.concat(feedsCfg.filter(f=>!OLD_DEFAULT_URLS.includes(f.url)));
  store.set('feeds',feedsCfg); store.set('feedsVer',FEEDS_VER);
}
let hidden = store.get('hidden', []);

// recordar la posición de la ventana (se guarda al moverla, así sobrevive a un apagado)
if(T?.window){
  const w=T.window.getCurrentWindow();
  (async()=>{
    const pos=store.get('winPos',null);
    if(pos){
      try{
        const mons=await T.window.availableMonitors();
        const ok=mons.some(m=>pos.x>=m.position.x-50 && pos.y>=m.position.y-50 && pos.x<m.position.x+m.size.width-60 && pos.y<m.position.y+m.size.height-60);
        if(ok) await w.setPosition(new T.dpi.PhysicalPosition(pos.x,pos.y));
      }catch(e){}
    }
    let tm; w.onMoved(({payload})=>{ clearTimeout(tm); tm=setTimeout(()=>store.set('winPos',{x:payload.x,y:payload.y}),400); });
  })();
}

// ventana: ancho fijo, alto según tarjetas
let maxH = 4000;
if(T?.window) T.window.currentMonitor().then(m=>{ if(m) maxH=Math.floor(m.size.height/m.scaleFactor)-40; }).catch(()=>{});
const fit = () => { if(!T?.window) return; const h=Math.min(maxH, Math.ceil($('#hub').getBoundingClientRect().height));
  T.window.getCurrentWindow().setSize(new T.dpi.LogicalSize(WIDTH, h)).catch(()=>{}); };
new ResizeObserver(fit).observe($('#hub'));

// sliders
const setAlpha = v => { document.documentElement.style.setProperty('--a',(v/100).toFixed(2)); store.set('alpha',+v); };
const setN = v => { document.documentElement.style.setProperty('--n',v); $('#nVal').textContent=v; store.set('nVis',+v); toTop(false); };
$('#alpha').value=store.get('alpha',42); $('#nVis').value=store.get('nVis',4);
$('#alpha').oninput=e=>setAlpha(e.target.value); $('#nVis').oninput=e=>setN(e.target.value);

// iconos
const WX = {0:'Despejado',1:'Mayormente despejado',2:'Parcialmente nublado',3:'Nublado',45:'Niebla',48:'Niebla',51:'Llovizna',53:'Llovizna',55:'Llovizna',61:'Lluvia débil',63:'Lluvia',65:'Lluvia fuerte',80:'Chaparrones',81:'Chaparrones',82:'Chaparrones fuertes',95:'Tormenta',96:'Tormenta con granizo',99:'Granizo fuerte'};
const sun='<circle cx="26" cy="24" r="10" fill="#ffc94d"/><g stroke="#ffc94d" stroke-width="3" stroke-linecap="round"><path d="M26 6v4M26 38v4M8 24h4M40 24h4M13 11l3 3M36 34l3 3M13 37l3-3M36 14l3-3"/></g>';
const cloud=(c='#fff')=>`<path class="cl" d="M20 52h28a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 20 52z" fill="${c}"/>`;
const drops='<g stroke="#7fc8ff" stroke-width="3" stroke-linecap="round"><path d="M26 56l-3 6M36 56l-3 6M46 56l-3 6"/></g>';
const bolt='<path d="M38 50l-6 9h6l-4 9 10-12h-6l4-6z" fill="#ffc94d"/>';
const stones='<g fill="#fff" stroke="#8fd3ff" stroke-width="2"><circle cx="24" cy="59" r="3.5"/><circle cx="36" cy="63" r="3.5"/><circle cx="47" cy="58" r="3.5"/></g>';
const icon=(c,cls='wxi')=>`<svg class="${cls}" viewBox="0 0 70 70">${c<=1?sun:c<=2?sun+cloud():c<=48?cloud('#dfe6ee'):c<95?cloud('#dfe6ee')+drops:c===95?cloud('#c9d2de')+bolt:cloud('#c9d2de')+stones}</svg>`;

/* ===== Granizo: mismo análisis que Rain Meter ===== */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(x,x0,x1,y0,y1)=>y0+(y1-y0)*clamp((x-x0)/(x1-x0),0,1);
function shear(s1,d1,s2,d2){const r=Math.PI/180;const u=s2*Math.sin(d2*r)-s1*Math.sin(d1*r),v=s2*Math.cos(d2*r)-s1*Math.cos(d1*r);return Math.hypot(u,v)}
function hailScore(h){
  const cape=h.cape??0, li=h.lifted_index??0, fz=h.freezing_level_height??4500, cin=h.convective_inhibition??0;
  const sh=shear(h.wind_speed_10m??0,h.wind_direction_10m??0,h.wind_speed_500hPa??0,h.wind_direction_500hPa??0);
  let s = cape<300?0 : cape<1000?lerp(cape,300,1000,0,30) : cape<2500?lerp(cape,1000,2500,30,55) : lerp(cape,2500,4000,55,65);
  if(cape>=300){ s+=lerp(sh,35,75,0,20); s+= fz<3500?10 : fz<4200?5 : fz>4600?-10:0; s+= li<-7?15 : li<-4?10 : li<-2?4:0; s+=(h.temperature_500hPa??0)<-12?5:0; if(cin<-150) s*=0.6; }
  const pp0=h.precipitation_probability??0, rainy=pp0>=50||(h.precipitation??0)>=.1||(h.showers??0)>=.1||[80,81,82,95,96,99].includes(h.weather_code);
  if(rainy){ const t5=h.temperature_500hPa??0,t8=h.temperature_850hPa??(t5+25),vt=t8-t5; let c=vt>=28?35:vt>=26?25:vt>=24?15:0;
    if(c){c+=t5<=-18?15:t5<=-15?10:0;c+=fz<=3000?15:fz<=3500?8:0;c+=cape>=300?10:cape>=100?5:0;c+=li<=2?5:0;s=Math.max(s,c)} }
  const rainNow=(h.precipitation??0)>=.3||(h.showers??0)>=.2||[80,81,82,95,96,99].includes(h.weather_code);
  if(rainNow&&cape>=100){ const t5=h.temperature_500hPa??0,t7=h.temperature_700hPa??t5+15,lapse=(t7-t5)/2.6; let c=t5<=-18?35:t5<=-15?25:t5<=-12?15:0;
    if(c){c+=fz<=3000?15:fz<=3500?10:0;c+=lapse>=7.2?15:lapse>=6.5?10:0;c+=cape>=300?5:0;s=Math.max(s,c)} }
  if(h.weather_code===95) s+=10;
  s*=(0.35+0.65*(pp0/100));
  if(h.weather_code===96||h.weather_code===99) s=Math.max(s,75);
  return Math.round(clamp(s,0,100));
}
const hailLevel=s=>s>=55?2:s>=30?1:0;
const LVL=['Sin granizo','Granizo posible','Granizo probable'];
const VARS='temperature_2m,precipitation,precipitation_probability,weather_code,cape,lifted_index,convective_inhibition,freezing_level_height,wind_speed_10m,wind_direction_10m,wind_speed_500hPa,wind_direction_500hPa,temperature_500hPa,temperature_700hPa,temperature_850hPa,showers';
const km=(a,b)=>{const r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;return 12742*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2))};
const getJSON = async u => { try{ const r=await fetch(u,{cache:'no-store'}); return r.ok?await r.json():null }catch{ return null } };

/* Temperatura real medida: estación SMN más cercana (Argentina) → METAR del aeropuerto más cercano → modelo */
async function observed(p){
  const near = (lat,lon) => km(p,{lat:+lat,lon:+lon});
  const smn = await getAny('https://ws.smn.gob.ar/map_items/weather');
  if(Array.isArray(smn)){
    const st = smn.filter(x=>x?.weather && x.weather.temp!=null && x.lat!=null)
      .map(x=>({x, d:near(x.lat,x.lon)})).sort((a,b)=>a.d-b.d)[0];
    if(st && st.d<40){ const w=st.x.weather;
      return { temp:+w.temp, hum:w.humidity!=null?+w.humidity:null, st:(w.st!=null&&w.st!=='')?+w.st:null,
               wind:w.wind_speed!=null?+w.wind_speed:null, desc:w.description||'', src:'SMN '+(st.x.name||''), time:null }; }
  }
  const b=[p.lat-.6,p.lon-.6,p.lat+.6,p.lon+.6].map(v=>v.toFixed(2)).join(',');
  const m = await getAny('https://aviationweather.gov/api/data/metar?format=json&bbox='+b);
  if(Array.isArray(m) && m.length){
    const st = m.filter(x=>x.temp!=null).map(x=>({x,d:near(x.lat,x.lon)})).sort((a,b)=>a.d-b.d)[0];
    if(st && st.d<40 && Date.now()-st.x.obsTime*1000 < 3*3600e3){ const x=st.x;
      const hum = x.dewp!=null ? Math.round(100*Math.exp(17.625*x.dewp/(243.04+x.dewp))/Math.exp(17.625*x.temp/(243.04+x.temp))) : null;
      return { temp:+x.temp, hum, st:null, wind:x.wspd!=null?Math.round(x.wspd*1.852):null, desc:'', src:'Aeropuerto '+(x.icaoId||''), time:x.obsTime*1000 }; }
  }
  return null;
}
const hm = s => s ? s.slice(11,16) : '—';
async function weather(){
  if(!place) await locate();
  const nearCba = km(place,CBA) < 25;
  const [d, fus, hn, ob] = await Promise.all([
    getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&hourly=${VARS}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_hours=12&forecast_days=6`),
    nearCba ? getJSON(RM+'fusion.json?t='+Date.now()) : null,
    nearCba ? getJSON(RM+'granizo.json?t='+Date.now()) : null,
    observed(place).catch(()=>null) ]);
  if(!d){ $('#c-clima').innerHTML='<span class="mute">Sin conexión con el clima</span>'; return; }
  const c=d.current, H=d.hourly, D=d.daily, off=d.utc_offset_seconds*1000;
  // horas: lluvia y granizo (análisis propio; en Córdoba se usa la fusión de modelos de Rain Meter si está al día)
  const fusH = fus && Date.now()-fus.updated < 45*60e3 ? fus.places?.cba?.hours||[] : [];
  const hrs = H.time.map((t,i)=>{
    const o={}; for(const k in H) if(k!=='time') o[k]=H[k][i];
    const ms=Date.parse(t+':00Z')-off, f=fusH.find(x=>x.t===ms);
    const hs=f?f.p:hailScore(o), mm=o.precipitation??0, pp=o.precipitation_probability??0;
    return { t, pp, hs, hl:hailLevel(hs), rl: mm>=6&&pp>=30?3 : mm>=2&&pp>=30?2 : pp>=50||mm>=.3?1:0 };
  });
  const maxR=Math.max(...hrs.map(h=>h.pp)), maxH=Math.max(...hrs.map(h=>h.hs)), lv=hailLevel(maxH);
  const firstH=hrs.find(h=>h.hl>0);
  const msg = lv ? `${LVL[lv]}${firstH?' desde las '+hm(firstH.t):''}` : maxR>=70 ? 'Lluvia probable' : maxR>=40 ? 'Puede llover' : 'Sin lluvia ni granizo';
  const today = new Date().toLocaleDateString('en-CA',{timeZone:'America/Argentina/Cordoba'});
  const barrios = hn && hn.date===today && hn.barrios?.length ? `<span class="hn">🧊 Hoy: ${hn.barrios.map(b=>esc(b.name)).join(', ')}</span>` : '';
  const days = D.time.slice(1,6).map((t,j)=>{const k=j+1;
    return `<div title="${D.precipitation_probability_max[k]}% lluvia"><span class="mute">${esc(new Date(t+'T12:00').toLocaleDateString('es-AR',{weekday:'short'}).slice(0,3))}</span>${icon(D.weather_code[k],'')}<b>${Math.round(D.temperature_2m_max[k])}°</b><span class="mute">${Math.round(D.temperature_2m_min[k])}°</span></div>`}).join('');
  const T0 = ob?.temp ?? c.temperature_2m, HU = ob?.hum ?? c.relative_humidity_2m, WI = ob?.wind ?? c.wind_speed_10m, ST = ob?.st ?? c.apparent_temperature;
  const when = new Date(ob?.time || Date.now()).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  const srcTxt = ob ? `${esc(ob.src.trim())} · ${when}` : `modelo · ${when}`;
  $('#c-clima').innerHTML=`<div class="now">${icon(c.weather_code)}<div class="temp">${Math.round(T0)}°</div>
      <div class="grow"><b>${esc(ob?.desc||WX[c.weather_code]||'—')}</b><div class="mute">ST ${Math.round(ST)}° · Hum ${HU??'—'}% · ${WI!=null?Math.round(WI):'—'} km/h</div><div class="mute" style="font-size:9.5px;opacity:.8">${srcTxt}</div></div>
      <div class="mute" style="text-align:right">↑ ${Math.round(Math.max(D.temperature_2m_max[0],T0))}°<br>↓ ${Math.round(D.temperature_2m_min[0])}°</div></div>
    <div class="st"><span class="tag ${lv?'l'+lv:''}">${esc(msg)}</span>${fusH.length?'<span class="mute">fusión de modelos</span>':''}${barrios}</div>
    <div class="strip"><span>Lluvia <b>${maxR}%</b></span><div class="cells">${hrs.map(h=>`<i class="${h.rl?'r'+h.rl:''}" title="${hm(h.t)} · ${h.pp}%"></i>`).join('')}</div>
      <span>Granizo <b>${maxH}%</b></span><div class="cells">${hrs.map(h=>`<i class="${h.hl?'h'+h.hl:''}" title="${hm(h.t)} · índice ${h.hs}"></i>`).join('')}</div>
      <span></span><div class="hrs">${hrs.map((h,i)=>`<span>${i%3?'':hm(h.t).slice(0,2)}</span>`).join('')}</div></div>
    <div class="days">${days}</div>`;
}

const getAny = async u => { try{ const r = T?.http ? await T.http.fetch(u,{headers:{'User-Agent':'Mozilla/5.0 StradaHub'}}) : await fetch(u); return r.ok ? await r.json() : null; }catch{ return null; } };
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/';
const dshort = t => new Date(t).toLocaleDateString('es-AR',{weekday:'short',day:'numeric'});
const scoreOf = c => c?.score?.displayValue ?? c?.score ?? '';
function fromEvent(ev, mine){
  const comp=ev.competitions?.[0]; if(!comp) return null;
  const h=comp.competitors.find(x=>x.homeAway==='home'), a=comp.competitors.find(x=>x.homeAway==='away');
  const st=comp.status?.type||ev.status?.type||{};
  const ab=x=>x?.team?.abbreviation||x?.team?.shortDisplayName||'';
  const tm=`${ab(h)} · ${ab(a)}`;
  if(st.state==='pre') return {sc:new Date(ev.date).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}), tm, dt:'próx. '+dshort(ev.date)};
  return {sc:`${scoreOf(h)}-${scoreOf(a)}`, tm, dt: st.state==='in' ? 'en vivo' : dshort(ev.date), live: st.state==='in'};
}
async function teamId(league, name){
  const k='espn:'+league+':'+name, c=store.get(k,null); if(c) return c;
  const d=await getAny(ESPN+`soccer/${league}/teams`);
  const t=d?.sports?.[0]?.leagues?.[0]?.teams?.map(x=>x.team).find(t=>t.displayName.includes(name));
  if(t) store.set(k,t.id); return t?.id;
}
async function soccerTeam(league, name){
  const id=await teamId(league,name); if(!id) return null;
  const d=await getAny(ESPN+`soccer/${league}/teams/${id}/schedule`);
  const evs=(d?.events||[]).sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));
  const live=evs.find(e=>e.competitions?.[0]?.status?.type?.state==='in');
  const last=[...evs].reverse().find(e=>e.competitions?.[0]?.status?.type?.completed);
  const next=evs.find(e=>e.competitions?.[0]?.status?.type?.state==='pre');
  return fromEvent(live||last||next);
}

// cinta de resultados: se mueve sola a la derecha; con ‹ › se mueve a mano y a los 20 s vuelve a andar sola
const TK = { x:0, target:null, idle:0, hover:false, speed:22 };   // px por segundo
function tkFrame(t){
  const r=$('#rail'); const dt=Math.min(.1,(t-(TK.t||t))/1000); TK.t=t;
  if(r){
    const W=r.scrollWidth/2;
    if(W>0){
      if(TK.target!=null){ TK.x += (TK.target-TK.x)*Math.min(1,dt*10); if(Math.abs(TK.target-TK.x)<.5){ TK.x=TK.target; } }
      else if(!TK.hover && Date.now()>TK.idle) TK.x += TK.speed*dt;
      if(Date.now()>TK.idle) TK.target=null;
      while(TK.x>=0){ TK.x-=W; if(TK.target!=null) TK.target-=W; }
      while(TK.x<-W){ TK.x+=W; if(TK.target!=null) TK.target+=W; }
      r.style.transform=`translateX(${TK.x}px)`;
    }
  }
  requestAnimationFrame(tkFrame);
}
requestAnimationFrame(tkFrame);

}

function cleanDesc(html,title){
  if(!html) return '';
  let t=new DOMParser().parseFromString(String(html),'text/html').body.textContent||'';
  t=t.replace(/\s+/g,' ').trim();
  const k=x=>x.toLowerCase().replace(/[^a-z0-9áéíóúñ]+/g,'');
  if(!t || k(t).startsWith(k(title).slice(0,40))) return '';
  return t.length>260 ? t.slice(0,257).replace(/\s\S*$/,'')+'…' : t;
}
// En la app: lectura directa del RSS (sin límites). En el navegador: vía rss2json.
async function rss(f){
  let list=[];
  if(T?.http){
    const r=await T.http.fetch(f.url,{headers:{'User-Agent':'Mozilla/5.0 StradaHub'}});
    if(!r.ok) throw new Error('feed');
    const x=new DOMParser().parseFromString(await r.text(),'text/xml');
    const nodes=[...x.querySelectorAll('item, entry')];
    if(!nodes.length) throw new Error('feed');
    const tx=(n,sel)=>n.querySelector(sel)?.textContent?.trim()||'';
    list=nodes.map(n=>({title:tx(n,'title'), link:tx(n,'link')||n.querySelector('link')?.getAttribute('href')||'',
      date:Date.parse(tx(n,'pubDate')||tx(n,'published')||tx(n,'updated'))||Date.now(), source:tx(n,'source'),
      desc:tx(n,'description')||tx(n,'summary')||tx(n,'content')}));
  }else{
    const d=await (await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f.url))).json();
    if(d.status!=='ok') throw new Error('feed');
    list=d.items.map(i=>({title:i.title,link:i.link,date:Date.parse(String(i.pubDate).replace(' ','T')+'Z')||Date.now(),source:'',desc:i.description||''}));
  }
  return list.sort((a,b)=>b.date-a.date).slice(0,PER_FEED).map(i=>{
    let title=i.title, src=f.name;
    if(/news\.google\./.test(f.url)){ const m=title.match(/^(.*) - ([^-]+)$/); if(m){ title=m[1]; src=m[2].split(/\s[|–—]\s/)[0].trim(); } else if(i.source) src=i.source; }
    const pf = f.cat==='Series' ? PLATFORMS.find(p=>p[0].test(title)) : null;
    return {cat:f.cat, src, title, link:i.link, date:i.date, pf: pf?[pf[1],pf[2]]:null, desc:cleanDesc(i.desc,title)};
  });
}
const ago=d=>{const m=Math.max(0,Math.round((Date.now()-d)/6e4));return m<60?`${m} min`:m<1440?`${Math.round(m/60)} h`:`${Math.round(m/1440)} d`};
const card=(n,isNew)=>`<a class="card nc${isNew?' new':''}" style="--c:${catColor(n.cat)}" data-u="${esc(n.link)}"><div class="mute"><span class="k">${esc(n.cat)}</span> · ${esc(n.src)} · hace ${ago(n.date)}</div><div class="t">${n.pf?`<span class="pf" style="background:${n.pf[1]}">${esc(n.pf[0])}</span>`:''}${esc(n.title)}</div>${n.desc?`<div class="d">${esc(n.desc)}</div>`:''}</a>`;
const atTop = () => $('#feed').scrollTop < 6;
const atEnd = () => { const f=$('#feed'); return f.scrollHeight-f.scrollTop-f.clientHeight < 8; };
function toTop(smooth=true){ const f=$('#feed'); f.style.scrollBehavior=smooth?'':'auto'; f.scrollTop=0; f.style.scrollBehavior=''; $('#up').textContent='▲'; arrows(); }
function arrows(){ $('#up').classList.toggle('on', !atTop()); $('#down').classList.toggle('on', !atEnd()); }
function render(newOnes=new Set()){
  const vis = items.filter(n=>!hidden.includes(n.cat));
  $('#feed').innerHTML = vis.length ? vis.map(n=>card(n,newOnes.has(n.link))).join('') : '<div class="card nc"><span class="mute">Sin noticias todavía</span></div>';
}
// clave para detectar la misma noticia aunque venga de otra fuente o con otro link
const keyOf = n => n.title.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim().slice(0,70);
let loading = false;
async function loadNews(reset=false){
  if(loading) return;                       // evita dos cargas al mismo tiempo
  loading = true;
  try{
    if(reset){ items=[]; seen.clear(); }
    const got=(await Promise.all(feedsCfg.map(f=>rss(f).catch(()=>[])))).flat();
    const fresh=[];
    for(const n of got){
      if(!n.link||!n.title) continue;
      const k=keyOf(n);
      if(seen.has(n.link)||seen.has(k)) continue;
      seen.add(n.link); seen.add(k); fresh.push(n);
    }
    if(!fresh.length && !reset) return;
    const first = items.length===0;
    const wasTop = atTop();
    items = items.concat(fresh).sort((a,b)=>b.date-a.date).slice(0,KEEP);   // nuevas arriba
    render(first ? new Set() : new Set(fresh.map(n=>n.link)));
    if(first || wasTop) toTop(false);
    else $('#up').innerHTML='▲<span class="dot"></span>';                    // hay nuevas arriba
    arrows();
  } finally { loading = false; }
}
const step = () => { const c=$('#feed .nc'); return c ? c.offsetHeight + 7 : 71; };
// si bajaste a ver anteriores, a los 20 s sin tocar nada vuelve arriba (a las más nuevas)
let idleUntil = 0;
const touch = () => { idleUntil = Date.now() + 20e3; };
$('#up').onclick = () => { touch(); $('#feed').scrollBy({top:-step()}); };
$('#down').onclick = () => { touch(); $('#feed').scrollBy({top:step()}); };
$('#feed').addEventListener('scroll', () => { arrows(); if(atTop()) $('#up').textContent='▲'; });
$('#feed').addEventListener('wheel', touch, {passive:true});
let hovT=null, hovEl=null;
$('#feed').addEventListener('mouseover', e => {
  const c=e.target.closest('.nc'); if(c===hovEl) return;
  clearTimeout(hovT); hovEl?.classList.remove('open'); hovEl=c;
  if(c) hovT=setTimeout(()=>{ c.classList.add('open'); touch(); setTimeout(()=>c.scrollIntoView({block:'nearest',behavior:'smooth'}),460); }, 2000);
});
$('#feed').addEventListener('mouseleave', () => { clearTimeout(hovT); hovEl?.classList.remove('open'); hovEl=null; });
$('#feed').addEventListener('mousemove', touch);
setInterval(() => { if(!atTop() && Date.now() > idleUntil) toTop(); }, 2e3);

// opciones
function applyHidden(){
  document.querySelectorAll('[data-name]').forEach(el=>el.hidden=hidden.includes(el.dataset.name));
  const names=[...document.querySelectorAll('[data-name]')].map(el=>el.dataset.name).concat(cats());
  $('#cardChips').innerHTML=names.map(n=>`<button class="chip ${hidden.includes(n)?'':'on'}" data-t="${esc(n)}">${esc(n)}</button>`).join('');
}
function renderSources(){
  $('#srcList').innerHTML = feedsCfg.length ? feedsCfg.map((f,i)=>`<div class="src"><span class="grow"><i class="cdot" style="background:${catColor(f.cat)}"></i><b>${esc(f.cat)}</b> · ${esc(f.name)}</span><button class="x" data-rm="${i}" title="Quitar">✕</button></div>`).join('') : '<span class="mute">Sin fuentes</span>';
  $('#cats').innerHTML = cats().map(c=>`<option value="${esc(c)}">`).join('');
}
function saveFeeds(){ store.set('feeds',feedsCfg); renderSources(); applyHidden(); loading=false; loadNews(true); }
$('#aBtn').onclick = async () => {
  const f={cat:$('#aCat').value.trim(), name:$('#aName').value.trim(), url:$('#aUrl').value.trim()};
  $('#aErr').textContent='';
  if(!f.cat||!f.name||!/^https?:\/\//.test(f.url)){ $('#aErr').textContent='Completá categoría, nombre y un link que empiece con http'; return; }
  $('#aBtn').textContent='Probando fuente…';
  try{ await rss(f); feedsCfg.push(f); saveFeeds(); $('#aName').value=$('#aUrl').value=''; }
  catch(e){ $('#aErr').textContent='No pude leer ese link. Tiene que ser un feed RSS (suele terminar en /feed o /rss).'; }
  $('#aBtn').textContent='+ Agregar';
};
$('#bReset').onclick = () => { feedsCfg = DEFAULT_FEEDS.slice(); saveFeeds(); };
const closeApp = () => T?.window ? T.window.getCurrentWindow().close() : window.close();
$('#bX').onclick = closeApp;
$('#bCfg').onclick = () => { $('#cfg').hidden = !$('#cfg').hidden; $('#cfg').scrollTop = 0; };

document.addEventListener('click',e=>{
  if(e.target.closest('#brand')){ open('https://www.instagram.com/hugo_strada/'); return; }
  if(e.target.closest('#c-clima')){ open(RM_APP); return; }
  const tk=e.target.closest('[data-tk]'); if(tk){ tkMove(+tk.dataset.tk); return; }
  const pk=e.target.closest('[data-pick]'); if(pk){ pickCity(+pk.dataset.pick); return; }
  const au=e.target.closest('[data-auto]'); if(au){ setAuto(au.dataset.auto==='1'); return; }
  const th=e.target.closest('[data-th]'); if(th){ setTheme(th.dataset.th); return; }
  const t=e.target.closest('[data-t]'); if(t){const k=t.dataset.t; hidden=hidden.includes(k)?hidden.filter(x=>x!==k):[...hidden,k]; store.set('hidden',hidden); applyHidden(); render(); toTop(false); return;}
  const r=e.target.closest('[data-rm]'); if(r){feedsCfg.splice(+r.dataset.rm,1); saveFeeds(); return;}
  const a=e.target.closest('[data-u]'); if(a){ e.preventDefault(); open(a.dataset.u); }
});

const tick=()=>{const d=new Date(); $('#clock').textContent=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}); const ds=d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'short'}).replace(',','').replace('.',''); $('#date').textContent=ds.charAt(0).toUpperCase()+ds.slice(1);};
$('#bRef').onclick=()=>{place=null;weather();dolar();loadNews();sports()};

setAlpha($('#alpha').value); setN($('#nVis').value); setTheme(store.get('theme','dark')); setLock(store.get('locked',false));
renderSources(); applyHidden();
tick(); setInterval(tick,30e3);
weather(); dolar(); loadNews().then(sports);
setInterval(()=>{weather();dolar();sports()}, WX_MIN*6e4);
setInterval(loadNews, NEWS_MIN*6e4);
}
</script>
